<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Reports</title><link rel="stylesheet" href="style.css"></head>
<body><div class="header"><h1>📊 Admin Reports</h1><p>Smart Student Outpass Management System</p></div><div class="container"><div id="cards" class="cards"></div><div class="table-box"><h2>📋 All Outpass Records</h2><div class="nav"><button onclick="render('')">All</button><button onclick="render('Pending')">Pending</button><button onclick="render('Approved')">Approved</button><button onclick="render('Completed')">Completed</button><button onclick="render('Rejected')">Rejected</button><button onclick="render('Expired')">Expired</button></div><div id="table"></div><a class="btn" href="index.html">Back to Student Login</a></div></div>
<script src="app.js"></script><script>
function render(filter){const a=data(),statuses=['Pending','Approved','Completed','Rejected','Expired'];cards.innerHTML=statuses.concat(['Total']).map(s=>`<div class="stat"><h2>${s==='Total'?a.length:a.filter(x=>x.status===s).length}</h2><p>${s}</p></div>`).join('');let rows=filter?a.filter(x=>x.status===filter):a;table.innerHTML=rows.length?`<table><tr><th>Outpass ID</th><th>Student</th><th>Student ID</th><th>Gender</th><th>Date</th><th>Out</th><th>Return</th><th>Destination</th><th>Reason</th><th>Status</th><th>Actual OUT</th><th>Actual IN</th></tr>${rows.map(x=>`<tr><td>${esc(x.code)}</td><td>${esc(x.student.name)}</td><td>${esc(x.student.code)}</td><td>${esc(x.student.gender)}</td><td>${esc(x.date)}</td><td>${esc(x.out)}</td><td>${esc(x.ret)}</td><td>${esc(x.destination)}</td><td>${esc(x.reason)}</td><td>${statusBadge(x.status)}</td><td>${esc(x.actualOut||'-')}</td><td>${esc(x.actualIn||'-')}</td></tr>`).join('')}</table>`:'<div class="alert">No outpass records found.</div>'}
render('');
</script></body></html>
